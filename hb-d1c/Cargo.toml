[package]
name = "hb-d1c"
version = "0.3.0"
edition = "2021"
authors = ["SaavyLab LLC <jayson@saavylab.com>"]
description = "Strict SQL-to-Rust generator for Cloudflare D1 and rusqlite"
license = "MIT"
repository = "https://github.com/saavylab/hb"
readme = "README.md"
include = [
    "src/**",
    "tests/generation.rs",
    "tests/fixtures/shared/**",
    "tests/fixtures/d1/d1c.toml",
    "tests/fixtures/d1/generated/**",
    "tests/fixtures/rusqlite_consumer/Cargo.toml.fixture",
    "tests/fixtures/rusqlite_consumer/Cargo.lock.fixture",
    "tests/fixtures/rusqlite_consumer/d1c.toml",
    "tests/fixtures/rusqlite_consumer/src/main.rs",
    "tests/fixtures/rusqlite_consumer/src/generated/**",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "GETTING_STARTED.md",
    "QUERY_FORMAT.md",
    "LICENSE",
]

[[bin]]
name = "d1c"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5", features = ["derive"] }
heck = "0.5.0"
inquire = "0.9.1"
notify = "8.2.0"
prettyplease = "0.2.37"
pathdiff = "0.2.3"
proc-macro2 = "1.0.103"
quote = "1.0.42"
rusqlite = { version = "0.37.0", features = ["bundled", "column_decltype", "column_metadata"]}
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10.9"
sqlparser = { version = "0.59.0", features = ["visitor"] }
syn = { version = "2.0.110", features = ["extra-traits"] }
toml = "0.9.8"
tempfile = "3"
walkdir = "2.5.0"
