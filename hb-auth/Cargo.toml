[package]
name = "hb-auth"
version = "0.2.0"
edition = "2021"
authors = ["SaavyLab LLC <jayson@saavylab.com>"]
description = "Identity and permissions for Cloudflare Workers."
license = "MIT"
repository = "https://github.com/saavylab/hb"
readme = "README.md"

[features]
default = ["axum"]
axum = ["dep:axum"]
kv = []

[dependencies]
worker = { version = "0.7", features = ['http'] }
axum = { version = "0.8", default-features = false, features = ["json"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.21"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Crypto", "SubtleCrypto", "CryptoKey"] }
wasm-bindgen = "0.2.106"
wasm-bindgen-futures = "0.4"
tracing = "0.1"
